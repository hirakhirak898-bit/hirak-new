<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hirak Pramanik — Founder & Builder</title>
<meta name="description" content="Founder portfolio — ventures, milestones, and the story behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2A4A; /* deep navy blue */
    --ink-2:#071C32; /* slightly darker navy for gradients/contrast */
    --paper:#ECF2F6; /* cool white to match navy/cyan theme */
    --accent:#3FDCD4; /* bright cyan-teal / rim light */
    --teal:#184D52; /* muted cyan-teal */
    --line: rgba(236,242,246,0.14); /* adapts to new --paper */
    --line-strong: rgba(236,242,246,0.28);
    --muted: rgba(236,242,246,0.62);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:var(--ink); }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 20px; } }

  a{ color:inherit; }

  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{ content:''; width:22px; height:1px; background:var(--accent); display:inline-block; }

  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; line-height:1.05; }

  /* ---------- NAV ---------- */
  header.nav{
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 1000px;
    z-index: 100;
    background: rgba(11, 42, 74, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(236, 242, 246, 0.08);
    border-radius: 100px;
    box-shadow: 0 4px 20px rgba(7, 28, 50, 0.12);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  header.nav.scrolled{
    top: 12px;
    background: rgba(7, 28, 50, 0.96);
    border-color: rgba(63, 220, 212, 0.15);
    box-shadow: 0 12px 30px rgba(7, 28, 50, 0.3);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; height:56px; padding: 0 16px; }
  .nav-inner .mark{ font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; color:var(--paper); }
  .nav-links{ display:flex; gap:28px; font-size:0.85rem; }
  .nav-links a{ text-decoration:none; color:var(--muted); transition:color .2s; }
  .nav-links a:hover, .nav-links a:focus-visible{ color:var(--paper); }
  .nav-cta{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    border:1px solid var(--line-strong); padding:7px 18px;
    border-radius: 50px;
    text-decoration:none; color:var(--paper); transition:all .2s;
  }
  .nav-cta:hover{ background:var(--accent); border-color:var(--accent); color:var(--ink); box-shadow: 0 0 15px rgba(63, 220, 212, 0.3); }
  @media (max-width:720px){ 
    .nav-links{ display:none; } 
    header.nav { width: calc(100% - 24px); top: 12px; }
    header.nav.scrolled { top: 8px; }
  }

  /* ---------- HERO ---------- */
  .hero{
    padding:120px 0 96px;
    background: #FFFFFF;
    color: var(--ink);
    border-bottom: 1px solid rgba(11, 42, 74, 0.08);
    position: relative;
    overflow: hidden;
  }
  .hero::after{
    content:''; position:absolute; right:-120px; top:-120px; width:480px; height:480px;
    background: radial-gradient(circle, rgba(63, 220, 212, 0.22) 0%, transparent 70%);
    pointer-events:none;
  }
  .hero-grid{ display:grid; grid-template-columns:1fr auto; gap:48px; align-items:end; }
  @media (max-width:720px){ 
    .hero-grid{ grid-template-columns:1fr; }
    .hero-photo{ margin: 32px auto 0; width: 300px; height: 375px; }
  }
  .hero h1{ font-size:clamp(2.6rem, 6vw, 4.6rem); margin:22px 0 20px; max-width:12ch; color: var(--ink); }
  .hero .tagline{ font-size:1.15rem; color:rgba(11, 42, 74, 0.7); max-width:46ch; }
  .hero .eyebrow{ color: #087C7C; }
  .hero .eyebrow::before{ background: #087C7C; }
  .hero-photo{
    width:360px; height:450px; border:1px solid rgba(11, 42, 74, 0.12);
    background:linear-gradient(160deg, rgba(11, 42, 74, 0.05), rgba(11, 42, 74, 0.15));
    box-shadow: 0 10px 25px rgba(11, 42, 74, 0.08);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    border-radius: 16px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .hero-photo:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 15px 35px rgba(63, 220, 212, 0.3);
  }
  .hero-actions{ display:flex; gap:14px; margin-top:36px; flex-wrap:wrap; }
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.82rem; padding:13px 24px;
    text-decoration:none; display:inline-block; transition:all .2s; border:1px solid transparent;
  }
  .hero .btn-primary{ background:var(--ink); color:#FFFFFF; }
  .hero .btn-primary:hover{ background:var(--accent); color:var(--ink); box-shadow: 0 0 20px rgba(63, 220, 212, 0.4); }
  .hero .btn-ghost{ border-color:rgba(11, 42, 74, 0.25); color:var(--ink); }
  .hero .btn-ghost:hover{ border-color:var(--accent); color:#087C7C; background:rgba(63, 220, 212, 0.08); box-shadow: 0 0 15px rgba(63, 220, 212, 0.15); }

  .btn-primary{ background:var(--accent); color:var(--ink); }
  .btn-primary:hover{ background:#2bbab2; box-shadow: 0 0 20px rgba(63, 220, 212, 0.3); }
  .btn-ghost{ border-color:var(--line-strong); color:var(--paper); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); box-shadow: 0 0 15px rgba(63, 220, 212, 0.15); }

  .stat-row{ display:flex; gap:48px; margin-top:64px; flex-wrap:wrap; }
  .stat .num{ font-family:'Fraunces', serif; font-size:2.1rem; color:var(--accent); }
  .hero .stat .num{ font-family:'Fraunces', serif; font-size:2.1rem; color:var(--ink); }
  .stat .label{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:4px; }
  .hero .stat .label{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:rgba(11, 42, 74, 0.6); text-transform:uppercase; letter-spacing:0.1em; margin-top:4px; }

  /* ---------- SECTION GENERIC ---------- */
  section{ padding:88px 0; border-bottom:1px solid var(--line); }
  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:48px; gap:24px; flex-wrap:wrap; }
  .section-head h2{ font-size:clamp(1.8rem,3.4vw,2.6rem); margin-top:12px; }

  /* ---------- ABOUT ---------- */
  .about-grid{
    display:grid; grid-template-columns:0.8fr 1.2fr; gap:64px; align-items:center;
  }
  @media (max-width:760px){
    .about-grid{ grid-template-columns:1fr; gap:40px; }
  }
  .about-photo{
    width:100%; max-width:300px; height:375px;
    border:1px solid var(--line-strong);
    background:linear-gradient(160deg, rgba(63, 220, 212, 0.08), var(--ink-2));
    box-shadow: 0 15px 35px rgba(7, 28, 50, 0.25);
    overflow:hidden;
    border-radius: 16px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .about-photo:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 20px 40px rgba(63, 220, 212, 0.15);
  }
  .about-photo img{ width:100%; height:100%; object-fit:cover; }
  @media (max-width:760px){
    .about-photo{ margin: 0 auto; }
  }


  /* ---------- LEDGER (Ventures) — signature element ---------- */
  .ledger{ border-top:1px solid var(--line-strong); }
  .ledger-row{
    display:grid; grid-template-columns:80px 1fr 200px 140px;
    gap:20px; align-items:center; padding:26px 0; border-bottom:1px solid var(--line);
    transition:background .2s, padding-left .2s;
  }
  .ledger-row:hover{ background:rgba(63, 220, 212, 0.05); padding-left: 8px; }
  @media (max-width:760px){
    .ledger-row{ grid-template-columns:1fr; gap:6px; padding:22px 0; }
    .ledger-row:hover{ padding-left: 0; }
    .ledger-row .l-year{ order:-1; }
  }
  .l-year{ font-family:'IBM Plex Mono', monospace; color:var(--accent); font-size:0.85rem; }
  .l-name{ font-family:'Fraunces', serif; font-size:1.35rem; font-weight:600; }
  .l-desc{ color:var(--muted); font-size:0.88rem; margin-top:4px; max-width:52ch; }
  .l-role{ font-family:'IBM Plex Mono', monospace; font-size:0.75rem; color:var(--muted); }
  .l-status{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; justify-self:end; padding:5px 12px; border:1px solid var(--line-strong); }
  @media (max-width:760px){ .l-status{ justify-self:start; } }
  .status-active{ color:var(--accent); border-color:var(--accent); }

  /* ---------- VENTURES ---------- */
  .ventures-grid{
    display:grid; grid-template-columns:1.2fr 0.8fr; gap:64px; align-items:center;
  }
  @media (max-width:760px){
    .ventures-grid{ grid-template-columns:1fr; gap:40px; }
  }
  .ventures-photo{
    width:100%; max-width:300px; height:375px;
    border:1px solid var(--line-strong);
    background:linear-gradient(160deg, rgba(63, 220, 212, 0.08), var(--ink-2));
    box-shadow: 0 15px 35px rgba(7, 28, 50, 0.25);
    overflow:hidden;
    border-radius: 16px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    margin-left: auto;
  }
  .ventures-photo:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 20px 40px rgba(63, 220, 212, 0.15);
  }
  .ventures-photo img{ width:100%; height:100%; object-fit:cover; }
  @media (max-width:760px){
    .ventures-photo{ margin: 0 auto; }
  }

  /* ---------- PRESS ---------- */
  .press-row{ display:flex; flex-wrap:wrap; gap:16px 40px; align-items:center; }
  .press-logo{ font-family:'IBM Plex Mono', monospace; font-size:0.85rem; color:var(--muted); border:1px dashed var(--line-strong); padding:10px 18px; }

  .milestones{ margin-top:56px; display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
  @media (max-width:720px){ .milestones{ grid-template-columns:1fr; } }
  .milestone{ background:var(--ink); padding:28px 26px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .milestone:hover{ transform: translateY(-2px); box-shadow: inset 0 0 15px rgba(63, 220, 212, 0.08); }
  .milestone .num{ font-family:'Fraunces', serif; color:var(--accent); font-size:1.6rem; }
  .milestone .desc{ font-family:'IBM Plex Mono', monospace; font-size:0.75rem; color:var(--muted); margin-top:8px; text-transform:uppercase; letter-spacing:0.05em; }

  /* ---------- SKILLS PILLS ---------- */
  .pill-row{ display:flex; flex-wrap:wrap; gap:12px; }
  .pill{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; padding:9px 18px; border:1px solid var(--line-strong); color:var(--muted); }

  /* ---------- TESTIMONIALS ---------- */
  .testi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
  @media (max-width:820px){ .testi-grid{ grid-template-columns:1fr; } }
  .testi{ background:var(--ink); padding:32px 28px; display:flex; flex-direction:column; justify-content:space-between; min-height:220px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .testi:hover{ transform: translateY(-2px); box-shadow: inset 0 0 15px rgba(63, 220, 212, 0.08); }
  .testi blockquote{ font-family:'Fraunces', serif; font-size:1.08rem; font-weight:450; line-height:1.4; }
  .testi cite{ font-style:normal; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--accent); display:block; margin-top:20px; }

  /* ---------- CONTACT ---------- */
  .contact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:64px; }
  @media (max-width:760px){ .contact-grid{ grid-template-columns:1fr; } }
  .contact h2{ font-size:clamp(2rem,4vw,3rem); max-width:14ch; }
  .contact p.lead{ color:var(--muted); margin-top:16px; max-width:46ch; }
  .social-row{ display:flex; gap:20px; margin-top:32px; }
  .social-row a{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; text-decoration:none; color:var(--muted); border-bottom:1px solid transparent; }
  .social-row a:hover{ color:var(--accent); border-color:var(--accent); }

  form{ display:flex; flex-direction:column; gap:18px; }
  label{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:8px; display:block; }
  input, textarea{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line-strong);
    color:var(--paper); font-family:'Inter', sans-serif; font-size:0.95rem; padding:10px 2px;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  input:focus, textarea:focus{ border-color:var(--accent); box-shadow: 0 1px 10px rgba(63, 220, 212, 0.15); }
  textarea{ resize:vertical; min-height:90px; }
  .submit-btn{
    align-self:flex-start; margin-top:8px; background:var(--accent); color:var(--ink); border:none;
    font-family:'IBM Plex Mono', monospace; font-size:0.82rem; padding:13px 26px; cursor:pointer; transition:background .2s, box-shadow .2s;
  }
  .submit-btn:hover{ background:#2bbab2; box-shadow: 0 0 20px rgba(63, 220, 212, 0.3); }

  footer{ padding:36px 0; }
  .footer-inner{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .footer-inner p{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--muted); }
  .back-top{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-decoration:none; color:var(--muted); }
  .back-top:hover{ color:var(--accent); }

  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  [data-reveal]{ opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease; }
  [data-reveal].in{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <div class="mark">Became No1</div>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#ventures">Ventures</a>
      <a href="#press">Press</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="nav-cta" href="#contact">Get in touch</a>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow">Founder &amp; Builder</div>
      <h1>HIRAK PRAMANIK</h1>
      <p class="tagline">Founder &amp; CEO</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#contact">Get in touch</a>
        <a class="btn btn-ghost" href="#ventures">View ventures</a>
      </div>
    </div>
    <div class="hero-photo">
      <img src="https://placehold.co/600x800/1a1a1a/cccccc?text=Founder+Photo" alt="Founder Portrait" style="width:100%; height:100%; object-fit:cover;">
    </div>
  </div>
</section>

<section id="about">
  <div class="wrap about-grid">
    <div class="about-photo-wrap" data-reveal>
      <div class="about-photo">
        <img src="https://placehold.co/600x800/1a1a1a/cccccc?text=Partner+Photo" alt="Partner Portrait">
      </div>
    </div>
    <div data-reveal>
      <h2>SUPRIYA BISWAS</h2>
    </div>
  </div>
</section>

<section id="ventures">
  <div class="wrap ventures-grid">
    <div data-reveal>
      <h2>RAHUL PAUL</h2>
    </div>
    <div class="ventures-photo-wrap" data-reveal>
      <div class="ventures-photo">
        <img src="https://placehold.co/600x800/1a1a1a/cccccc?text=Rahul+Paul" alt="Rahul Paul">
      </div>
    </div>
  </div>
</section>

<section id="press">
  <div class="wrap about-grid">
    <div class="about-photo-wrap" data-reveal>
      <div class="about-photo">
        <img src="https://placehold.co/600x800/1a1a1a/cccccc?text=Team+Member" alt="Team Member">
      </div>
    </div>
    <div data-reveal>
      <h2>ANIRBAN PRAMANIK</h2>
    </div>
  </div>
</section>

<section id="testimonials">
  <div class="wrap ventures-grid">
    <div data-reveal>
      <h2>RONI KARMAKAR</h2>
    </div>
    <div class="ventures-photo-wrap" data-reveal>
      <div class="ventures-photo">
        <img src="https://placehold.co/600x800/1a1a1a/cccccc?text=Roni+Karmakar" alt="Roni Karmakar">
      </div>
    </div>
  </div>
</section>

<section id="contact" style="border-bottom:none; text-align: center; padding: 120px 0;">
  <div class="wrap" data-reveal>
    <h1 style="font-size: clamp(3.5rem, 9vw, 7.5rem); font-family: 'Fraunces', serif; color: var(--accent); margin: 0; letter-spacing: -0.02em; text-shadow: 0 0 50px rgba(63, 220, 212, 0.35);">
      Became No1
    </h1>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <p>© <span id="year"></span> Hirak Pramanik. All rights reserved.</p>
    <a class="back-top" href="#top">Back to top ↑</a>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));

  // Toggle scrolled class on navbar for transparent-to-dark transition
  const nav = document.querySelector('header.nav');
  const handleScroll = () => {
    if (window.scrollY > 20) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }
  };
  window.addEventListener('scroll', handleScroll);
  handleScroll(); // Run initially in case page is refreshed while scrolled
</script>

</body>
</html>
